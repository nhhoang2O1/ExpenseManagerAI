plugins {
    alias(libs.plugins.android.application)
}

def configuredReleaseBackendUrl = project.findProperty("backendUrl")
        ?: System.getenv("BACKEND_BASE_URL")
        ?: ""
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (configuredReleaseBackendUrl && !configuredReleaseBackendUrl.endsWith("/")) {
    configuredReleaseBackendUrl = configuredReleaseBackendUrl + "/"
}

android {
    namespace 'com.example.appquanlychitieu'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.appquanlychitieu"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "String", "BACKEND_BASE_URL", '"http://127.0.0.1:8080/"'
        }
        release {
            if (releaseTaskRequested &&
                    (!configuredReleaseBackendUrl || !configuredReleaseBackendUrl.startsWith("https://"))) {
                throw new GradleException("Release builds require -PbackendUrl=https://... or BACKEND_BASE_URL=https://...")
            }
            def releaseUrl = configuredReleaseBackendUrl ?: "https://invalid.invalid/"
            buildConfigField "String", "BACKEND_BASE_URL", "\"${releaseUrl}\""
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    lint {
        // Dependency upgrades are reviewed separately from code-quality lint because
        // major AGP/library changes require their own migration and regression pass.
        disable 'AndroidGradlePluginVersion', 'GradleDependency'
    }
}

dependencies {
    // AndroidX Core
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // MPAndroidChart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    // Fragment
    implementation 'androidx.fragment:fragment:1.6.2'

    // Backend API and encrypted JWT storage
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Test
    testImplementation libs.junit
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
