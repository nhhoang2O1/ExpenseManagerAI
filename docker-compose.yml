services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense_manager}
      POSTGRES_USER: ${POSTGRES_USER:-expense_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ocr-service:
    image: expense-manager-ocr-gpu:local
    build:
      context: ./ocr-service
      dockerfile: Dockerfile.gpu
    gpus: all
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      OCR_HOST: 0.0.0.0
      OCR_PORT: "8000"
      OCR_DEVICE: gpu
      OCR_PRELOAD_MODEL: "true"
      OCR_USE_DOC_ORIENTATION_CLASSIFY: "true"
      OCR_USE_DOC_UNWARPING: "true"
      OCR_USE_TEXTLINE_ORIENTATION: "true"
      OCR_MAX_IMAGE_SIDE: "1600"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-expense_manager};Username=${POSTGRES_USER:-expense_manager};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrations: "true"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OCR_SERVICE_BASE_URL: http://ocr-service:8000
      LegacyReceiptPath: /app/storage/receipts
      Email__Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Email__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?Set SMTP_FROM_ADDRESS in .env}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-Expense Manager}
      Email__Smtp__Username: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      Email__Smtp__Password: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
    ports:
      - "8080:8080"
    volumes:
      # Read-only compatibility mount used only to import receipts created by
      # older versions. New uploads are stored in PostgreSQL receipt_images.
      - receipt-storage:/app/storage/receipts:ro
    depends_on:
      postgres:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  receipt-storage:
